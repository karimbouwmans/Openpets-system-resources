    <text x="22" y="56" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">satellite HUD · own pin slot</text>

    <g transform="translate(22 78)">
      <g stroke="#38bdf8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
