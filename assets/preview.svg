      <text x="16" y="28" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Virtual Pet</text>
      <text x="16" y="52" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">food · energy</text>
      <text x="16" y="74" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">play · bond</text>
