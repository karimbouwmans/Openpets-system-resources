<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">OpenPets System Resources development preview</title>
  <desc id="desc">Satellite HUD with CPU, RAM, GPU and SSD meters to the left of the pet. Virtual Pet stats stay on the pet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="820" cy="70" r="160" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="120" cy="480" r="180" fill="#22d3ee" opacity="0.08"/>

  <text x="48" y="48" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="0.18em">DEVELOPMENT PREVIEW</text>
  <text x="48" y="86" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">System Resources</text>
  <text x="48" y="116" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Live CPU, RAM, GPU and SSD to the left of your pet</text>

